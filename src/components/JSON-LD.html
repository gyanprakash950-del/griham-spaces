<!-- JSON-LD Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "<%= siteName %>",
  "description": "<%= tagline %> - Premium furniture, decor & electronics at affordable prices in Bhagalpur, Bihar.",
  "url": "https://grihamspaces.com/",
  "telephone": "<%= phone %>",
  "email": "<%= email %>",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Mathura Enclave, D.N. Singh Road, Kharmanchak, near Zudio Store",
    "addressLocality": "Bhagalpur",
    "addressRegion": "Bihar",
    "postalCode": "812001",
    "addressCountry": "IN"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 25.245,
    "longitude": 86.985
  },
  "openingHoursSpecification": [
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
      "opens": "11:00",
      "closes": "20:30"
    }
  ],
  "sameAs": [
    "https://www.instagram.com/grihamspaces.in/",
    "https://wa.me/918969343308"
  ],
  "priceRange": "₹₹",
  "currenciesAccepted": "INR",
  "paymentAccepted": "Cash, Credit Card, UPI, EMI"
}
</script>

<!-- Breadcrumb JSON-LD (page-specific) -->
<% if (breadcrumbData && breadcrumbData.length > 0) { %>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://grihamspaces.com/"
    }
    <% breadcrumbData.forEach(function(item, index) { %>
    ,{
      "@type": "ListItem",
      "position": <%= index + 2 %>,
      "name": "<%= item.name %>",
      "item": "https://grihamspaces.com/<%= item.url %>"
    }
    <% }); %>
  ]
}
</script>
<% } %>

<!-- Product/ItemList JSON-LD for category pages -->
<% if (productListData && productListData.length > 0) { %>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": [
    <% productListData.forEach(function(product, index) { %>
    {
      "@type": "ListItem",
      "position": <%= index + 1 %>,
      "item": {
        "@type": "Product",
        "name": "<%= product.name %>",
        "description": "<%= product.description %>",
        "brand": {
          "@type": "Brand",
          "name": "<%= product.sectionLabel %>"
        },
        "offers": {
          "@type": "Offer",
          "priceCurrency": "INR",
          "price": "<%= product.price.replace(/[^0-9.]/g, '') %>",
          "availability": "https://schema.org/InStock",
          "url": "https://wa.me/918969343308?text=<%= encodeURIComponent(product.whatsappMessage || 'Hello, I am interested in ' + product.name) %>"
        },
        "image": "<%= product.image %>"
      }
    }
    <% if (index < productListData.length - 1) { %>,<% } %>
    <% }); %>
  ]
}
</script>
<% } %>
