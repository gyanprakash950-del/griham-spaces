# Netlify Configuration for Griham Spaces
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command (npm run build)
  command = "npm run build"
  # Directory to deploy (dist folder)
  publish = "dist"
  # Base directory (project root)
  base = ""

[build.environment]
  # Node version
  NODE_VERSION = "20"
  # NPM version
  NPM_VERSION = "10"

# Custom headers for performance and security
[[headers]]
  # Cache static assets aggressively
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Cache CSS/JS files
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Cache images
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Cache data files
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  # Security headers for HTML pages
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Security headers for all responses
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirects for clean URLs and SPA fallback
[[redirects]]
  # Clean URLs: /furniture -> /furniture.html
  from = "/furniture"
  to = "/furniture.html"
  status = 200

[[redirects]]
  from = "/decor"
  to = "/decor.html"
  status = 200

[[redirects]]
  from = "/electronics"
  to = "/electronics.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  # Trailing slash redirect
  from = "/*/"
  to = "/:splat"
  status = 301

[[redirects]]
  # SPA fallback for any unmatched routes (optional - only if needed)
  # from = "/*"
  # to = "/index.html"
  # status = 200

